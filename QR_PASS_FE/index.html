<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techkada 2026</title>

    <!-- WEBSITE LOGO/FAVICON -->
    <link rel="icon" type="image/png" href="./assets/images/cei2026f.png" />

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    
    <script defer src="./assets/scripts/utils/animation.js"></script>
    <script type="module" src="./assets/scripts/utils/timer.js"></script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" />

    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/blobAnimation.css">
</head>
<body>

    <nav class="nav">
         <!-- LEFT: CIT Logo -->
         <img src="./assets/images/citlogo.png" alt="CIT Logo" class="nav-logo">
         
         <!-- MIDDLE: UA Logo -->
         <img src="./assets/images/UA-LOGO.png" alt="University of the Assumption Logo" class="nav-logo">
         
         <!-- RIGHT: SSITE Logo -->
         <img src="./assets/images/sssitelogo.jpg" alt="SSITE Logo" class="nav-logo">
    </nav>

    <div class="blob-outer-container">
        <div class="blob-inner-container">
            <div class="blob"></div>
        </div>
    </div>

    <section class="hero-container">
        <div class="countdown-container">
            <p class="countdown-subtitle">Research Forum</p>
            <div class="countdown-timer">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">Days</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">Hours</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">Minutes</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">Seconds</div>
                </div>
            </div>
        </div>
        
        <img src="./assets/images/cei2026f.png" alt="Techkada 2026" class="event-logo">
        
        <p class="hero-container-subtext">𝐁𝐞𝐲𝐨𝐧𝐝 𝐭𝐡𝐞 𝐂𝐨𝐝𝐞 — 𝐃𝐞𝐯𝐞𝐥𝐨𝐩. 𝐃𝐞𝐩𝐥𝐨𝐲. 𝐃𝐨𝐦𝐢𝐧𝐚𝐭𝐞.</p>
        
        <p style="margin-top: 1.5rem; color: #EBEBEB; font-size: 0.9rem; letter-spacing: 1px;">
            <i class="fa-solid fa-calendar-day" style="color: #C41E3A;"></i> May 25, 2026 | 
            <i class="fa-solid fa-location-dot" style="color: #C41E3A;"></i> Multi-purpose Hall
        </p>
    </section>

    <section class="cards-container">
        <div class="cards">
            <a class="card" href="./userPage.html">
                <i class="fa-solid fa-qrcode"></i>
                <h3>Student Portal</h3>
                <p>Register and generate your unique QR entry pass.</p>
            </a>

            <a class="card" href="./adminPage.html">
                <i class="fa-solid fa-shield-halved"></i>
                <h3>Admin Portal</h3>
                <p>Verify participant entries and monitor real-time forum attendance.</p>
            </a>
        </div>
    </section>

</body>
</html>
