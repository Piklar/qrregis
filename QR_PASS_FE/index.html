<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>INNOVAIT 2025</title>

    <!-- GSAP -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js" integrity="sha512-NcZdtrT77bJr4STcmsGAESr06BYGE8woZdSdEgqnpyqac7sugNO+Tr4bGwGF3MsnEkGKhU2KL2xh6Ec+BqsaHA==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    
    <!-- Scripts for onload animations -->
    <script defer src="./assets/scripts/utils/animation.js"></script>

    <script src="./assets/scripts/utils/timer.js"></script>

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- CSS Files -->
    <link rel="stylesheet" href="./assets/css/index.css">
    <link rel="stylesheet" href="./assets/css/global.css">
    <link rel="stylesheet" href="./assets/css/blobAnimation.css">
</head>
<body>
    <!-- Navigation -->
    <nav class="nav">
         <img src="./assets/images/UAQR WHITE LOGO.png" alt="">
         <img src="./assets/images/UA-LOGO.png" alt="">
         <img src="./assets/images/IT-LOGO.png" alt="">
    </nav>

    <!-- Blob animated background -->
    <div class="blob-outer-container">
        <div class="blob-inner-container">
            <div class="blob"></div>
        </div>
    </div>

    <!-- Header -->
    <section class="hero-container">
        
        <div class="countdown-container">
            <p class="countdown-subtitle">Starts in:</p>
            
            <div class="countdown-timer">
                <div class="countdown-item">
                    <div class="countdown-number" id="days">00</div>
                    <div class="countdown-label">day(s)</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="hours">00</div>
                    <div class="countdown-label">hour(s)</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="minutes">00</div>
                    <div class="countdown-label">minute(s)</div>
                </div>
                <div class="countdown-item">
                    <div class="countdown-number" id="seconds">00</div>
                    <div class="countdown-label">second(s)</div>
                </div>
            </div>
        </div>

        <!-- Header texts -->
        <p class="uppertext">COLLEGE OF INFORMATION TECHNOLOGY, <br> COMPUTING, AND LIBRARY SCIENCE</p>
        <h2 class="header-title">𝐈𝐍𝐍𝐎𝐕𝐀𝐈𝐓</h2>
        <h2 class="subheader-title gradient-text">𝟐𝟎𝟐𝟓</h2>
        <p class="hero-container-subtext">𝐓𝐫𝐚𝐧𝐬𝐟𝐨𝐫𝐦𝐢𝐧𝐠 𝐕𝐢𝐬𝐢𝐨𝐧𝐬 𝐢𝐧𝐭𝐨 𝐈𝐧𝐧𝐨𝐯𝐚𝐭𝐢𝐨𝐧𝐬!</p>
    </section>

    <!-- Cards -->
    <section class="cards-container">
        <div class="cards">
            <a class="card" href="./userPage.html" >
                <i class="fa-solid fa-qrcode"></i>
                <h3>Student Portal</h3>
                <p>Register and generate QR codes.</p>
            </a>

            <a class="card" href="./adminPage.html">
                <i class="fa-solid fa-user-tie"></i>
                <h3>Admin Portal</h3>
                <p>Manage and view attendees.</p>
            </a>
        </div>
    </section>
</body>
</html>
